<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de dano</title>
  <desc id="desc">Fórmula de dano preservada da regra vigente: dano-base escalado, potência, margem, modificadores fixos e Proteção.</desc>
  <rect width="1100" height="360" fill="#f0f0f0"/>
  <g fill="#363636" stroke="#f0f0f0" stroke-width="5">
    <rect x="35" y="125" width="180" height="82"/><rect x="235" y="125" width="150" height="82"/>
    <rect x="405" y="125" width="150" height="82"/><rect x="575" y="125" width="205" height="82"/><rect x="800" y="125" width="250" height="82"/>
  </g>
  <g fill="#fdfdfd" font-family="Georgia,serif" font-size="24" text-anchor="middle">
    <text x="125" y="165">dano-base</text><text x="125" y="195">escalado</text><text x="310" y="175">potência</text><text x="480" y="175">margem</text><text x="677" y="165">modificadores</text><text x="677" y="195">fixos</text><text x="925" y="165">− Proteção</text><text x="925" y="195">= dano final</text>
  </g>
  <g stroke="#b7b7b7" stroke-width="4" fill="none">
    <path d="M215 166h20M385 166h20M555 166h20M780 166h20"/>
    <path d="M227 156l12 10-12 10M397 156l12 10-12 10M567 156l12 10-12 10M792 156l12 10-12 10"/>
  </g>
  <text x="55" y="78" font-family="Georgia,serif" font-size="28" fill="#363636">fórmula de resolução</text>
</svg>
