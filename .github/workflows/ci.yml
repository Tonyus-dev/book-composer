name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: book_maker
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Historical formatting debt is reported but does not block the
      # product gates below; typecheck and build remain blocking.
      - name: Lint (known historical debt)
        continue-on-error: true
        run: bun run lint
      - run: bun run typecheck
      - run: bun run build
